<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menuisier FR — французька для столяра</title>
<meta name="description" content="Тренажер французької A1–A2 для столяра: словник з фото, самопрезентація з відео, діалоги на роботі, числа і розміри.">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b8622a'/%3E%3Cpath d='M14 44 44 14l6 6-30 30z' fill='%23f6d9b8'/%3E%3Cpath d='M38 14h12v8H38z' fill='%23333'/%3E%3C/svg%3E">
<style>
/* =========================================================
   1. ДИЗАЙН: кольори, шрифти, базові елементи
   ========================================================= */
:root {
  --bg: #f5f2ec;
  --card: #ffffff;
  --card-2: #faf8f4;
  --text: #1e1b17;
  --muted: #6d665c;
  --line: #e7e1d6;
  --accent: #b8622a;
  --accent-ink: #ffffff;
  --accent-soft: #f7e6d7;
  --green: #2e8a57;
  --green-soft: #dff1e6;
  --red: #cf3f3f;
  --red-soft: #fbe3e1;
  --m: #2f6fd6;
  --f: #c6407a;
  --pl: #6a5acd;
  --v: #2e8a57;
  --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 4px 16px rgba(40, 30, 10, .06);
  --radius: 16px;
  --tabbar-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --card: #211f1c; --card-2: #1b1a17; --text: #f2eee7; --muted: #a59e93; --line: #36322c;
    --accent: #e3894c; --accent-ink: #1a1007; --accent-soft: #3a281b;
    --green: #4cc184; --green-soft: #1d3326; --red: #f06b6b; --red-soft: #3b2020;
    --m: #7aa8ff; --f: #ff86b9; --pl: #a99bff; --v: #4cc184;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --card: #211f1c; --card-2: #1b1a17; --text: #f2eee7; --muted: #a59e93; --line: #36322c;
  --accent: #e3894c; --accent-ink: #1a1007; --accent-soft: #3a281b;
  --green: #4cc184; --green-soft: #1d3326; --red: #f06b6b; --red-soft: #3b2020;
  --m: #7aa8ff; --f: #ff86b9; --pl: #a99bff; --v: #4cc184;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
  overflow-x: hidden;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .75em; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; }
.center { text-align: center; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.grow { flex: 1; min-width: 0; }
.hidden { display: none !important; }
[lang="fr"] { font-feature-settings: "kern"; }

/* ---------- Верхня панель ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; }
.topbar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); font-size: .85rem; white-space: nowrap; text-decoration: none;
}
.chip b { color: var(--accent); }

/* ---------- Основний контейнер ---------- */
main { max-width: 780px; margin: 0 auto; padding: 16px; }
main:focus { outline: none; }
.page-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; }
.page-head h1 { margin: 0; font-size: 1.35rem; }
.back { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; text-decoration: none; flex: none; }
.section-title { margin: 22px 0 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }

/* ---------- Картки ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card + .card { margin-top: 12px; }
.grid { display: grid; gap: 12px; }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.grid.tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile {
  display: flex; flex-direction: column; gap: 6px; text-decoration: none;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
  transition: transform .12s ease;
}
.tile:active { transform: scale(.98); }
.tile .emoji { font-size: 1.7rem; line-height: 1; }
.tile .t { font-weight: 650; }
.tile .s { color: var(--muted); font-size: .85rem; }

/* ---------- Кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); text-decoration: none; font-weight: 600; line-height: 1.2;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.say {
  flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card-2); display: inline-grid; place-items: center; padding: 0;
}
.say svg { width: 18px; height: 18px; fill: var(--accent); }
.say.big { width: 48px; height: 48px; }
.say.big svg { width: 24px; height: 24px; }
.say.speaking { background: var(--accent); }
.say.speaking svg { fill: var(--accent-ink); }

/* ---------- Прогрес ---------- */
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.green > i { background: var(--green); }
.ring { --p: 0; width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); }
.ring > span { width: 42px; height: 42px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: .78rem; font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 650; background: var(--card-2); border: 1px solid var(--line); }
.badge.ok { background: var(--green-soft); color: var(--green); border-color: transparent; }
.badge.warn { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* ---------- Головна ---------- */
.hero { display: flex; gap: 14px; align-items: center; }
.hero .big { font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1; }
.sec-list { display: grid; gap: 10px; }
.sec-item { display: flex; align-items: center; gap: 12px; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.sec-item .t { font-weight: 650; }
.sec-item .s { color: var(--muted); font-size: .85rem; }
.sec-item .num { margin-left: auto; color: var(--muted); }

/* ---------- Словник ---------- */
.word-card { display: flex; gap: 12px; align-items: flex-start; }
.word-card .pic, .pic {
  width: 96px; height: 96px; flex: none; border-radius: 12px; overflow: hidden;
  background: var(--card-2); border: 1px solid var(--line); display: grid; place-items: center; position: relative;
}
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; opacity: 0; transition: opacity .25s; }
.pic img.ok { opacity: 1; }
.pic svg { width: 86%; height: 86%; }
.pic.lg { width: 180px; height: 180px; border-radius: 18px; }
.pic.sm { width: 64px; height: 64px; border-radius: 10px; }
.word-fr { font-size: 1.15rem; font-weight: 700; }
.art { font-weight: 700; }
.g-m .art, .g-m.art { color: var(--m); }
.g-f .art, .g-f.art { color: var(--f); }
.g-pl .art, .g-pl.art { color: var(--pl); }
.g-v .art, .g-v.art { color: var(--v); }
.gtag { font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .85; }
.ex { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--card-2); font-size: .92rem; }
.ex .uk { color: var(--muted); font-size: .85rem; }
.known-btn { margin-left: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; color: var(--muted); }

/* Флешкартка */
.flash { min-height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; cursor: pointer; user-select: none; }
.flash .word-fr { font-size: 1.6rem; }
.flash .tr { font-size: 1.2rem; }

/* ---------- Тести ---------- */
.quiz-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.quiz-head .bar { flex: 1; }
.q-prompt { text-align: center; margin: 6px 0 16px; }
.q-prompt .big { font-size: 1.6rem; font-weight: 700; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card);
  font-size: 1.02rem; min-height: 52px; display: flex; align-items: center; gap: 10px;
}
.opt.ok { border-color: var(--green); background: var(--green-soft); }
.opt.bad { border-color: var(--red); background: var(--red-soft); }
.opt[disabled] { cursor: default; }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; }
.feedback.ok { background: var(--green-soft); }
.feedback.bad { background: var(--red-soft); }
.input {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  font-size: 1.05rem;
}
.input:focus { outline: none; border-color: var(--accent); }
.accents { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.accents button { min-width: 38px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--card-2); }
.result-big { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }

/* ---------- Відеоплеєр ---------- */
.player { background: #0d0d0f; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); color: #fff; }
.player:fullscreen { border-radius: 0; display: flex; flex-direction: column; justify-content: center; }
.stage { position: relative; aspect-ratio: 16 / 9; background: #222; overflow: hidden; }
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage video, .stage iframe, .stage .yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.stage .big-play {
  position: absolute; right: 12px; bottom: 12px;
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px 10px 16px; border-radius: 99px; border: 0;
  background: rgba(0,0,0,.62); color: #fff; font-weight: 700; transition: opacity .2s; white-space: nowrap;
}
.stage .big-play svg { width: 22px; height: 22px; fill: #fff; }
.stage .badge-live { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); padding: 3px 9px; border-radius: 99px; font-size: .75rem; }
.stage .stage-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: rgba(0,0,0,.75); font-size: .95rem; }
.captions { min-height: 86px; padding: 10px 14px 12px; background: #0d0d0f; text-align: center; }
.cap-fr { font-size: 1.12rem; font-weight: 600; line-height: 1.35; }
.cap-fr .w { transition: color .1s; }
.cap-fr .w.on { color: #ffd166; }
.cap-uk { margin-top: 4px; font-size: .92rem; color: #ffd9a8; }
.captions.off-fr .cap-fr, .captions.off-uk .cap-uk { display: none; }
.controls { display: flex; align-items: center; gap: 4px; padding: 8px 8px 10px; background: #17171a; flex-wrap: wrap; }
.controls button {
  min-width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: #fff;
  display: inline-grid; place-items: center; font-weight: 700; font-size: .85rem; padding: 0 8px;
}
.controls button svg { width: 22px; height: 22px; fill: #fff; }
.controls button.on { background: rgba(255,255,255,.16); }
.controls button.off { opacity: .45; }
.controls .time { font-size: .8rem; color: #bbb; font-variant-numeric: tabular-nums; padding: 0 6px; }
.controls .sp { flex: 1; }
.segs { display: flex; gap: 3px; padding: 0 10px; height: 14px; align-items: center; background: #17171a; cursor: pointer; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); }
.segs i.done { background: #e3894c; }
.segs i.cur { background: #ffd166; }
.video-card { display: flex; flex-direction: column; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.video-card .thumb { aspect-ratio: 16/9; background: #333; position: relative; }
.video-card .thumb svg, .video-card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video-card .thumb .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.7); color: #fff; padding: 1px 7px; border-radius: 6px; font-size: .78rem; }
.video-card .thumb .ptype { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.6); color: #fff; padding: 1px 7px; border-radius: 6px; font-size: .72rem; }
.video-card .info { padding: 10px 12px 12px; }
.video-card .info .t { font-weight: 650; }
.transcript { display: grid; gap: 6px; }
.tline { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 12px; border: 1px solid transparent; }
.tline.cur { border-color: var(--accent); background: var(--accent-soft); }
.tline .fr { font-weight: 600; }
.tline .uk { color: var(--muted); font-size: .88rem; }

/* ---------- Фрази / діалоги ---------- */
.phrase { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.phrase:last-child { border-bottom: 0; }
.phrase.cur { background: var(--accent-soft); border-radius: 10px; }
.phrase .fr { font-weight: 600; }
.phrase .uk { color: var(--muted); font-size: .9rem; }
.qa-q { color: var(--accent); }
.dlg { display: grid; gap: 10px; }
.bubble { max-width: 88%; padding: 10px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
.bubble.me { margin-left: auto; background: var(--accent-soft); border-color: transparent; border-bottom-right-radius: 4px; }
.bubble.them { border-bottom-left-radius: 4px; }
.bubble .who { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.bubble .fr { font-weight: 600; }
.bubble .uk { color: var(--muted); font-size: .88rem; }
.bubble.now { outline: 2px solid var(--accent); }
.bubble.hide-fr .fr { filter: blur(6px); user-select: none; }
.bubble.your-turn { outline: 2px dashed var(--accent); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg-ctl button { border: 0; background: transparent; padding: 8px 12px; font-weight: 600; font-size: .9rem; }
.seg-ctl button.on { background: var(--accent); color: var(--accent-ink); }

/* ---------- Конструктор ---------- */
.form { display: grid; gap: 12px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
.field .input, .field select { width: 100%; }
select.input { appearance: auto; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--card-2); font-size: .9rem; cursor: pointer; }
.checks input { accent-color: var(--accent); }
.kid { border: 1px dashed var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.gen-line { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.gen-line:last-child { border-bottom: 0; }
.gen-line .fr { font-weight: 600; }
.gen-line .uk { color: var(--muted); font-size: .88rem; }
.gen-line.cur { background: var(--accent-soft); border-radius: 10px; }
.blank { display: inline-block; min-width: 2.2em; border-bottom: 2px solid var(--accent); color: transparent; user-select: none; cursor: pointer; }
.blank.show { color: inherit; border-color: transparent; background: var(--accent-soft); border-radius: 4px; }

/* ---------- База ---------- */
.num-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.num-cell { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-align: left; }
.num-cell b { font-size: 1.1rem; min-width: 2.4em; }
.num-cell span { font-size: .85rem; }
.swatch { width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(0,0,0,.15); flex: none; }
.clock { width: 120px; height: 120px; }
.clock-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); }
.clock-opt.ok { border-color: var(--green); background: var(--green-soft); }
.clock-opt.bad { border-color: var(--red); background: var(--red-soft); }
.opts.clocks { grid-template-columns: 1fr 1fr; }

/* ---------- Нижнє меню ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--line);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: .68rem; font-weight: 600; min-width: 0; }
.tabbar a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
.tabbar svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a.on { color: var(--accent); }
@media (min-width: 720px) {
  .tabbar { max-width: 640px; margin: 0 auto 12px; left: 0; right: 0; border: 1px solid var(--line); border-radius: 20px; height: var(--tabbar-h); padding-bottom: 0; box-shadow: var(--shadow); bottom: env(safe-area-inset-bottom); }
  .tabbar a { font-size: .74rem; }
}

/* ---------- Сповіщення ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .92rem; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 32px); text-align: center; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

// Посилання на файл у Commons (для сторінки «Джерела фото»)
function photoUrl(id) {
  const p = PHOTOS[id];
  if (!p) return '';
  return p[0].startsWith('http') ? p[0] : 'https://upload.wikimedia.org/wikipedia/commons/thumb/' + p[0];
}
function photoPage(id) {
  const p = PHOTOS[id];
  if (!p) return '';
  const parts = p[0].replace('https://upload.wikimedia.org/wikipedia/commons/', '').replace(/^thumb\//, '').split('/');
  return 'https://commons.wikimedia.org/wiki/File:' + parts[2];
}

// Зубці пили вздовж відрізка
function teeth(x1, y1, x2, y2, n, d, col) {
  const dx = (x2 - x1) / n, dy = (y2 - y1) / n, len = Math.hypot(x2 - x1, y2 - y1);
  const nx = (-(y2 - y1) / len) * d, ny = ((x2 - x1) / len) * d;
  let p = `M${x1} ${y1}`;
  for (let i = 0; i < n; i++) {
    const ax = x1 + dx * i, ay = y1 + dy * i;
    p += ` L${(ax + dx * 0.25 + nx).toFixed(1)} ${(ay + dy * 0.25 + ny).toFixed(1)} L${(ax + dx).toFixed(1)} ${(ay + dy).toFixed(1)}`;
  }
  return `<path d="${p} Z" fill="${col}"/>`;
}
// Диск пили із зубцями
function sawDisc(cx, cy, r, col) {
  let p = '';
  const n = 18;
  for (let i = 0; i < n; i++) {
    const a1 = (i / n) * Math.PI * 2, a2 = ((i + 0.6) / n) * Math.PI * 2;
    p += `${i ? 'L' : 'M'}${(cx + Math.cos(a1) * r).toFixed(1)} ${(cy + Math.sin(a1) * r).toFixed(1)} L${(cx + Math.cos(a2) * (r + 3)).toFixed(1)} ${(cy + Math.sin(a2) * (r + 3)).toFixed(1)} `;
  }
  return `<path d="${p}Z" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="${r * 0.62}" fill="none" stroke="${C.md}" stroke-width="1" opacity=".5"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="${C.k}"/>`;
}
// Стрілка (можна з двома вістрями)
function arrow(x1, y1, x2, y2, col = C.r, both = false) {
  const a = Math.atan2(y2 - y1, x2 - x1), s = 5;
  const head = (x, y, ang) => `M${(x - Math.cos(ang - 0.5) * s).toFixed(1)} ${(y - Math.sin(ang - 0.5) * s).toFixed(1)} L${x} ${y} L${(x - Math.cos(ang + 0.5) * s).toFixed(1)} ${(y - Math.sin(ang + 0.5) * s).toFixed(1)}`;
  return `<path d="M${x1} ${y1} L${x2} ${y2} ${head(x2, y2, a)}${both ? ' ' + head(x1, y1, a + Math.PI) : ''}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
}
// Дугова стрілка (обертання)
function spin(cx, cy, r, cw = true, col = C.r) {
  const a0 = cw ? -2.6 : -0.5, a1 = cw ? 0.6 : -3.7;
  const x0 = cx + Math.cos(a0) * r, y0 = cy + Math.sin(a0) * r, x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
  const t = cw ? a1 + Math.PI / 2 : a1 - Math.PI / 2, s = 5;
  return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 ${cw ? 1 : 0} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/>` +
    `<path d="M${(x1 - Math.cos(t - 0.5) * s).toFixed(1)} ${(y1 - Math.sin(t - 0.5) * s).toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)} L${(x1 - Math.cos(t + 0.5) * s).toFixed(1)} ${(y1 - Math.sin(t + 0.5) * s).toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
}

// Французькою: числа словами (0 – 999 999)
const UNITS_FR = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
const TENS_FR = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante'];
function below100(n) {
  if (n < 20) return UNITS_FR[n];
  if (n < 70) { const t = Math.floor(n / 10), u = n % 10; return TENS_FR[t] + (u === 0 ? '' : u === 1 ? ' et un' : '-' + UNITS_FR[u]); }
  if (n < 80) return n === 71 ? 'soixante et onze' : 'soixante-' + UNITS_FR[n - 60];
  return n === 80 ? 'quatre-vingts' : 'quatre-vingt-' + UNITS_FR[n - 80];
}
function numFr(n) {
  if (n < 100) return below100(n);
  if (n < 1000) { const h = Math.floor(n / 100), r = n % 100; const s = h === 1 ? 'cent' : UNITS_FR[h] + (r === 0 ? ' cents' : ' cent'); return r ? s + ' ' + below100(r) : s; }
  const th = Math.floor(n / 1000), r = n % 1000;
  const s = th === 1 ? 'mille' : numFr(th).replace(/cents$/, 'cent') + ' mille';
  return r ? s + ' ' + numFr(r) : s;
}
const femFr = (s) => s.replace(/(^|[ -])un$/, '$1une');

// Час французькою: розмовний варіант і «офіційний» (24 години)
function hourFr(h) {
  if (h === 0) return 'minuit';
  if (h === 12) return 'midi';
  const h12 = h > 12 ? h - 12 : h;
  return femFr(numFr(h12)) + (h12 === 1 ? ' heure' : ' heures');
}
function timeFr(h, m, official = false) {
  if (official) return femFr(numFr(h)) + (h <= 1 ? ' heure' : ' heures') + (m ? ' ' + femFr(numFr(m)) : '');
  if (m === 0) return hourFr(h);
  if (m === 15) return hourFr(h) + ' et quart';
  if (m === 30) return hourFr(h) + (h === 0 || h === 12 ? ' et demi' : ' et demie');
  const next = (h + 1) % 24;
  if (m === 45) return hourFr(next) + ' moins le quart';
  if (m > 30) return hourFr(next) + ' moins ' + femFr(numFr(60 - m));
  return hourFr(h) + ' ' + femFr(numFr(m));
}
const timeDigits = (h, m) => `${h} h ${String(m).padStart(2, '0')}`;

/* ---------- Озвучка (Web Speech API, голос fr-FR) ---------- */
const FEMALE_RE = /(hortense|julie|denise|am[eé]lie|aur[eé]lie|marie|audrey|c[eé]line|virginie|[eé]lo[iï]se|vivienne|brigitte|coralie|jacqueline|jos[eé]phine|yvette|ariane|charlotte|sylvie|chantal|l[eé]a|google fran[cç]ais|female|femme)/i;
const MALE_RE = /(paul|henri|thomas|claude|nicolas|jacques|r[eé]my|antoine|guillaume|daniel|mathieu|jean|fabrice|g[eé]rard|alain|yannick|vincent|eloi|j[eé]r[oô]me|maxime|sylvain|louis|alexandre|lucien|fr[eé]d[eé]ric|hugo|pierre|remi|male|homme)/i;
const TTS = {
  voices: [],
  supported: 'speechSynthesis' in window,
  current: null,
  init() {
    if (!this.supported) return;
    const load = () => {
      this.voices = speechSynthesis.getVoices().filter((v) => /^fr/i.test(v.lang));
      if (typeof onVoicesChanged === 'function') onVoicesChanged();
    };
    load();
    speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', load) : (speechSynthesis.onvoiceschanged = load);
  },
  gender(v) { return FEMALE_RE.test(v.name) ? 'f' : MALE_RE.test(v.name) ? 'm' : ''; },
  // Найкращий французький голос; для персонажів — ще й потрібної статі
  pick(gender) {
    if (!this.voices.length) return null;
    const chosen = this.voices.find((v) => v.voiceURI === S.settings.voice);
    if (!gender && chosen) return chosen;
    const score = (v) => (/^fr[-_]FR/i.test(v.lang) ? 4 : 0) + (/natural|online|neural|premium|enhanced/i.test(v.name) ? 2 : 0) + (/google/i.test(v.name) ? 1 : 0) +
      (gender && this.gender(v) === gender ? 6 : 0) + (v === chosen ? 1.5 : 0);
    return this.voices.slice().sort((a, b) => score(b) - score(a))[0];
  },
  stop() {
    if (this.current) { this.current.cancelled = true; this.current = null; }
    if (this.supported) speechSynthesis.cancel();
    $$('.say.speaking').forEach((b) => b.classList.remove('speaking'));
  },
  // Оцінка тривалості фрази в секундах (для таймера і запасного режиму без голосу)
  estimate(text, rate = 1) { return (0.35 + text.length * 0.062) / rate; },
  speak(text, o = {}) {
    const job = { cancelled: false, done: false };
    const prevBusy = this.supported && (speechSynthesis.speaking || speechSynthesis.pending);
    this.stop();
    this.current = job;
    const rate = clamp((o.rate || S.settings.rate || 0.9), 0.5, 1.5);
    const finish = () => { if (job.done) return; job.done = true; clearTimeout(job.watch); if (this.current === job) this.current = null; if (!job.cancelled && o.onend) o.onend(); };
    const voice = this.pick(o.gender);
    if (!this.supported || !voice) {
      // Немає французького голосу — просто «граємо» за таймером, щоб анімація й субтитри працювали
      if (o.onstart) o.onstart();
      job.watch = setTimeout(finish, this.estimate(text, rate) * 1000);
      return job;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice.lang || 'fr-FR'; u.voice = voice; u.rate = rate; u.pitch = clamp(o.pitch || 1, 0, 2);
    u.onstart = () => { if (!job.cancelled && o.onstart) o.onstart(); };
    u.onboundary = (e) => { if (!job.cancelled && o.onboundary) o.onboundary(e); };
    u.onend = finish;
    u.onerror = (e) => { if (e.error !== 'interrupted' && e.error !== 'canceled') finish(); };
    // Запобіжник: деякі браузери іноді «забувають» надіслати onend
    job.watch = setTimeout(finish, (this.estimate(text, rate) * 2.2 + 4) * 1000);
    const go = () => { if (job.cancelled) return; try { speechSynthesis.resume(); } catch (e) {} speechSynthesis.speak(u); };
    if (prevBusy) setTimeout(go, 80); else go();
    return job;
  },
};

   Сцена = фон + персонаж (SVG). Персонаж моргає, рухає губами, коли «говорить»,
   а голос — це озвучка браузера з різною висотою тону і швидкістю. */

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => clamp(Math.round(v + amt * 2.55), 0, 255);
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
const MOUTH_Y = 34;
function mouthPath(open, w = 13) {
  const top = MOUTH_Y - 2 - open * 2, bot = MOUTH_Y + 3 + open * 13;
  return `M${-w} ${MOUTH_Y - 1} Q0 ${top} ${w} ${MOUTH_Y - 1} Q0 ${bot} ${-w} ${MOUTH_Y - 1}Z`;
}

function personSVG(c, id, x, y, s = 1) {

  if (outfit === 'vest') torso = `<path d="${body}" fill="#4a5560"/><path d="M-24 96 Q0 116 24 96" fill="none" stroke="#3a434c" stroke-width="5"/><path d="M-112 250 C-110 150 -82 112 -40 101 L-14 150 V250Z M112 250 C110 150 82 112 40 101 L14 150 V250Z" fill="${col}"/><path d="M-104 176 H-14 V188 H-106Z M-110 210 H-14 V222 H-111Z M104 176 H14 V188 H106Z M110 210 H14 V222 H111Z" fill="#e9eef2"/>`;
  if (outfit === 'chef') torso = `<path d="${body}" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="2"/><path d="M-12 100 L34 250" stroke="#d6d6d6" stroke-width="2"/>${[136, 170, 204].map((yy) => `<circle cx="-14" cy="${yy}" r="3.2" fill="#c9c9c9"/><circle cx="34" cy="${yy}" r="3.2" fill="#c9c9c9"/>`).join('')}<path d="M-22 96 Q0 112 22 96 L10 124 L0 114 L-10 124Z" fill="${c.scarf || '#d63b3b'}"/>`;
  if (outfit === 'cardigan') torso += `<path d="M-26 96 L0 176 L26 96Z" fill="#ece6da"/><path d="M-18 96 L-4 116 L-12 98Z M18 96 L4 116 L12 98Z" fill="#fff"/><path d="M-6 120 L0 176 L6 120" fill="none" stroke="${col2}" stroke-width="2"/>${[186, 212, 238].map((yy) => `<circle cx="-4" cy="${yy}" r="3" fill="${col2}"/>`).join('')}`;
  if (c.apron) torso += `<path d="M-40 124 H40 V150 L62 160 V250 H-62 V160 L-40 150Z" fill="${c.apron}"/><path d="M-40 124 L-28 96 M40 124 L28 96" stroke="${c.apron}" stroke-width="6"/><rect x="-26" y="186" width="52" height="30" rx="3" fill="${shade(c.apron, -14)}"/><path d="M-12 186 l4 -22" stroke="#d94a3d" stroke-width="5"/><path d="M8 186 l2 -18" stroke="#9aa3ad" stroke-width="4"/>`;

  // Волосся спереду
  if (hairStyle === 'short') front = `<path d="M-52 -4 C-60 -58 -28 -80 0 -78 C34 -80 60 -56 52 -4 C49 -26 44 -38 32 -46 C10 -38 -18 -40 -34 -48 C-46 -38 -50 -24 -52 -4Z" fill="${hair}"/>`;
  if (hairStyle === 'long') front = `<path d="M-53 -2 C-62 -64 -16 -84 8 -78 C46 -76 64 -48 53 -2 C47 -32 28 -50 4 -52 C-14 -40 -36 -34 -53 -2Z" fill="${hair}"/>`;
  if (hairStyle === 'bun' || hairStyle === 'ponytail') front = `<path d="M-52 -6 C-58 -64 -20 -76 0 -74 C22 -76 58 -64 52 -6 C47 -40 26 -54 0 -54 C-26 -54 -47 -40 -52 -6Z" fill="${hair}"/>`;

  if (hairStyle === 'curly') front = [[-44, -30], [-32, -50], [-12, -60], [10, -60], [30, -52], [44, -32], [-48, -10], [48, -10]].map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="15" fill="${hair}"/>`).join('');

  // Борода, окуляри, зморшки, сережки, олівець за вухом
  const beardShape = `M-48 8 C-46 46 -24 66 0 66 C24 66 46 46 48 8 C40 28 26 30 14 27 C6 23 -6 23 -14 27 C-26 30 -40 28 -48 8Z`;

}

// Повна сцена: фон + персонаж(і). prefix робить id унікальними на сторінці.
function sceneSVG(v, prefix = 'sc') {
  const c = v.character || {};
  const bg = (BG[v.background] || BG.maison)();
  let people = '';
  const kids = c.kids || [];
  if (kids[0]) people += personSVG(Object.assign({ kid: true, outfit: 'tshirt' }, kids[0]), `${prefix}-k0`, 150, 236, 0.62);
  if (kids[1]) people += personSVG(Object.assign({ kid: true, outfit: 'tshirt' }, kids[1]), `${prefix}-k1`, 492, 250, 0.56);
  people += personSVG(c, `${prefix}-p`, kids.length ? 320 : 320, 148, 1);
  return `<svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${bg}${people}</svg>`;
}

// Підсвічування слів у субтитрах
function capWords(text) {
  let pos = 0;
  return text.split(/(\s+)/).map((part) => {
    const start = pos; pos += part.length;
    return /\s+/.test(part) || !part ? part : `<span class="w" data-s="${start}" data-e="${pos}">${esc(part)}</span>`;
  }).join('');
}
function showCaption(line) {
  const fr = $('#capFr'), uk = $('#capUk');
  if (!fr) return;
  fr.innerHTML = line ? capWords(line.fr) : '&nbsp;';
  uk.textContent = line ? line.uk : ' ';
}
function highlightChar(ci) {
  $$('#capFr .w').forEach((w) => w.classList.toggle('on', +w.dataset.s <= ci && ci < +w.dataset.e + 1));
}

// Анімована сцена: озвучка фраза за фразою + рух губ + моргання
function mountScenePlayer(v, hooks) {
  const script = v.script || [];
  const voice = v.voice || {};
  const st = { i: 0, playing: false, talking: false, open: 0, job: null, boundary: false, phraseStart: 0, est: 1, timer: null, raf: 0, nextBlink: performance.now() + 1500, blinkUntil: 0, kidBlink: [performance.now() + 2600, performance.now() + 3900], gapUntil: 0 };
  const speed = () => (S.settings.speed === 0.75 ? 0.75 : 1);
  const rate = () => (voice.rate || 1) * speed();
  const durs = () => script.map((l) => TTS.estimate(l.fr, rate()) + 0.45);
  const P = (s) => document.getElementById('pl-p-' + s);

  function paintSegs() {
    $$('#segs i').forEach((el, k) => { el.className = k < st.i ? 'done' : k === st.i && (st.playing || st.started) ? 'cur' : ''; });
    $$('.tline').forEach((el) => el.classList.toggle('cur', !!(+el.dataset.i === st.i && (st.playing || st.started))));
    const btn = $('#plToggle'); if (btn) btn.innerHTML = st.playing ? ICO.pause : ICO.play;
    const bp = $('.big-play'); if (bp) bp.style.opacity = st.playing ? '0' : '1', bp.style.pointerEvents = st.playing ? 'none' : 'auto';
  }
  function sayLine(i, keepPlaying = true) {
    if (i < 0 || i >= script.length) return;
    st.i = i; st.started = true; st.boundary = false;
    const line = script[i];
    showCaption(line); paintSegs();
    st.est = TTS.estimate(line.fr, rate());
    st.phraseStart = performance.now(); st.talking = true;
    st.job = TTS.speak(line.fr, {
      gender: voice.gender, pitch: voice.pitch, rate: rate(),
      onstart: () => { st.phraseStart = performance.now(); st.talking = true; },
      onboundary: (e) => { st.boundary = true; highlightChar(e.charIndex); st.open = 1; },
      onend: () => {
        st.talking = false; highlightChar(9999);
        if (!keepPlaying || !st.playing) { paintSegs(); return; }
        st.gapUntil = performance.now() + 450;
        st.timer = setTimeout(() => {
          if (!st.playing) return;
          if (st.i + 1 < script.length) sayLine(st.i + 1);
          else finish();
        }, 450);
      },
    });
  }
  function finish() {
    st.playing = false; st.talking = false; st.i = script.length - 1; st.ended = true;
    paintSegs(); updateTime(true);
    if (hooks && hooks.onEnd) hooks.onEnd();
  }
  function play() {
    if (!TTS.supported) toast('Браузер не підтримує озвучку — субтитри йдуть за таймером', 3500);
    else if (!TTS.voices.length) toast('Французький голос не знайдено — субтитри йдуть за таймером', 3500);
    if (st.ended) { st.ended = false; st.i = 0; }
    st.playing = true; clearTimeout(st.timer); sayLine(st.i);
  }
  function pause() { st.playing = false; st.talking = false; clearTimeout(st.timer); TTS.stop(); paintSegs(); }
  function updateTime(end) {
    const d = durs(), total = d.reduce((a, b) => a + b, 0);
    let el = d.slice(0, st.i).reduce((a, b) => a + b, 0);
    if (st.talking) el += Math.min(d[st.i], (performance.now() - st.phraseStart) / 1000);
    if (end) el = total;
    const t = $('#plTime'); if (t) t.textContent = `${fmtTime(el)} / ${fmtTime(total)}`;
  }

  // Кадр анімації: губи, моргання, легкий рух голови
  function frame(now) {
    st.raf = requestAnimationFrame(frame);
    const sec = now / 1000;
    let target = 0;
    if (st.talking) {
      target = 0.25 + 0.55 * Math.abs(Math.sin(sec * 11.5)) * (0.55 + 0.45 * Math.sin(sec * 4.3 + 1));
      if (!st.boundary) { // немає подій «слово» — підсвічуємо за часом
        const p = clamp((now - st.phraseStart) / 1000 / st.est, 0, 1);
        highlightChar(Math.floor(p * (script[st.i] ? script[st.i].fr.length : 0)));
      }
    }
    st.open += (target - st.open) * 0.35;
    const m = P('mouth'); if (m) m.setAttribute('d', mouthPath(st.open));
    const th = P('teeth'); if (th) th.setAttribute('opacity', st.open > 0.35 ? '1' : '0');
    if (now > st.nextBlink) { st.blinkUntil = now + 130; st.nextBlink = now + 2200 + Math.random() * 3000; }
    const sy = now < st.blinkUntil ? 0.1 : 1;
    const eL = P('eyeL'), eR = P('eyeR');
    if (eL) { eL.setAttribute('transform', `translate(-18 -5) scale(1 ${sy})`); eR.setAttribute('transform', `translate(18 -5) scale(1 ${sy})`); }
    const head = P('head');
    if (head) head.setAttribute('transform', `rotate(${(st.talking ? Math.sin(sec * 1.7) * 2.2 : Math.sin(sec * 0.6) * 0.8).toFixed(2)} 0 60)`);
    const bob = P('bob'); if (bob) bob.setAttribute('transform', `translate(0 ${(Math.sin(sec * 1.4) * 1.6).toFixed(2)})`);
    const br = P('brows'); if (br) br.setAttribute('transform', `translate(0 ${st.talking ? (-1.5 - Math.max(0, Math.sin(sec * 2.3)) * 2).toFixed(2) : 0})`);
    for (let k = 0; k < 2; k++) {
      const a = document.getElementById(`pl-k${k}-eyeL`), b = document.getElementById(`pl-k${k}-eyeR`);
      if (!a) continue;
      if (now > st.kidBlink[k]) st.kidBlink[k] = now + 2500 + Math.random() * 3500;
      const ks = st.kidBlink[k] - now > 0 && st.kidBlink[k] - now < 130 ? 0.1 : 1;
      a.setAttribute('transform', `translate(-18 -5) scale(1 ${ks})`); b.setAttribute('transform', `translate(18 -5) scale(1 ${ks})`);
      const kb = document.getElementById(`pl-k${k}-bob`); if (kb) kb.setAttribute('transform', `translate(0 ${(Math.sin(sec * 1.9 + k) * 2).toFixed(2)})`);
    }
  }
  st.raf = requestAnimationFrame(frame);
  const tick = setInterval(() => updateTime(), 250);
  onCleanup(() => { cancelAnimationFrame(st.raf); clearInterval(tick); clearTimeout(st.timer); st.playing = false; });
  updateTime(); paintSegs();

  return {
    toggle() { st.playing ? pause() : play(); },
    play, pause,
    repeat() { clearTimeout(st.timer); const was = st.playing; if (!st.started) st.i = st.i || 0; sayLine(st.i, was); },
    prev() { clearTimeout(st.timer); st.ended = false; sayLine(Math.max(0, st.i - 1), st.playing); },
    next() { clearTimeout(st.timer); st.ended = false; if (st.i + 1 < script.length) sayLine(st.i + 1, st.playing); },
    jump(i) { clearTimeout(st.timer); st.ended = false; sayLine(i, st.playing); },
    speedChanged() { updateTime(); },
  };
}

// Справжнє відео: mp4 або YouTube, субтитри — за полем t у фразах
function mountMediaPlayer(v, hooks) {
  const t = videoType(v);
  const cues = (v.script || []).filter((l) => typeof l.t === 'number').sort((a, b) => a.t - b.t);
  let cur = -1, yt = null, poll = 0;
  const media = {
    time: () => 0, seek: () => {}, play: () => {}, rate: () => {},
  };
  function sync() {
    const now = media.time();
    let i = -1;
    for (let k = 0; k < cues.length; k++) if (cues[k].t <= now + 0.05) i = k;
    if (i !== cur) {
      cur = i; showCaption(cues[i] || null);
      $$('.tline').forEach((el) => el.classList.toggle('cur', cues[i] && el.dataset.fr === cues[i].fr));
    }
  }
  if (t === 'mp4') {
    const el = $('#player video');
    el.playbackRate = S.settings.speed === 0.75 ? 0.75 : 1;
    media.time = () => el.currentTime; media.seek = (s) => { el.currentTime = s; }; media.play = () => el.play(); media.rate = (r) => { el.playbackRate = r; };
    el.addEventListener('timeupdate', sync);
    el.addEventListener('ended', () => hooks && hooks.onEnd && hooks.onEnd());
    el.addEventListener('error', () => {
      $('#player .stage').insertAdjacentHTML('beforeend', `<div class="stage-msg">Не вдалося відкрити відеофайл<br><code>${esc(v.src)}</code><br><span class="small">Перевірте, що файл лежить у папці videos поруч з index.html і має формат mp4 (H.264).</span></div>`);
    });
  }
  if (t === 'youtube') {
    const id = youtubeId(v.src);
    const box = $('#ytBox');
    if (!id) { box.innerHTML = '<div class="stage-msg">Посилання на YouTube не розпізнано</div>'; return media; }
    if (location.protocol === 'file:') {
      box.innerHTML = `<div class="stage-msg"><div>YouTube не відтворює відео на сторінці, відкритій як файл.<br>Відкрийте застосунок через сайт (GitHub Pages) або локальний сервер.<br><br><a class="btn small" style="color:#fff" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Відкрити на YouTube</a></div></div>`;
      return media;
    }
    const plain = () => { box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0&cc_load_policy=1&cc_lang_pref=fr&hl=fr" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(v.title)}"></iframe>`; };
    if (!cues.length) { plain(); return media; }
    loadYT().then(() => {
      if (!document.body.contains(box)) return;
      box.innerHTML = '<div id="ytInner"></div>';
      yt = new YT.Player('ytInner', {
        videoId: id, width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, cc_lang_pref: 'fr', hl: 'fr' },
        events: {
          onReady: () => { if (S.settings.speed === 0.75) yt.setPlaybackRate(0.75); },
          onStateChange: (e) => { if (e.data === 0 && hooks && hooks.onEnd) hooks.onEnd(); },
          onError: (e) => { box.insertAdjacentHTML('beforeend', `<div class="stage-msg">${e.data === 101 || e.data === 150 || e.data === 153 ? 'Автор відео заборонив показ на інших сайтах.' : 'YouTube не зміг відтворити відео.'}<br><a class="btn small" style="color:#fff" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Відкрити на YouTube</a></div>`); },
        },
      });
      media.time = () => (yt && yt.getCurrentTime ? yt.getCurrentTime() : 0);
      media.seek = (s) => yt && yt.seekTo && yt.seekTo(s, true);
      media.play = () => yt && yt.playVideo && yt.playVideo();
      media.rate = (r) => yt && yt.setPlaybackRate && yt.setPlaybackRate(r);
      poll = setInterval(sync, 300);
    }).catch(plain);
  }
  onCleanup(() => clearInterval(poll));
  return {
    repeat() { const c = cues[Math.max(0, cur)]; if (c) { media.seek(c.t); media.play(); } },
    jumpCue(i) { if (cues[i]) { media.seek(cues[i].t); media.play(); } },
    speedChanged() { media.rate(S.settings.speed === 0.75 ? 0.75 : 1); },
    cues,
  };
}
let ytPromise = null;
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytPromise) return ytPromise;
  ytPromise = new Promise((resolve, reject) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { ytPromise = null; reject(); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytPromise = null; reject(); } }, 9000);
  });
  return ytPromise;
}

// Міні-тест з варіантами відповідей. qs: [{ q, options, answer }]
function renderMiniQuiz(box, qs, onDone) {
  let i = 0, score = 0;
  const order = qs.map((q) => ({ q: q.q, options: shuffle(q.options.map((o, k) => ({ o, ok: k === q.answer }))) }));
  function step() {
    if (i >= order.length) {
      const p = pct(score, order.length);
      box.innerHTML = `<div class="center stack"><div class="result-big">${score}/${order.length}</div><p>${p >= 80 ? 'Чудово! Ви добре зрозуміли відео 👏' : p >= 50 ? 'Непогано! Перегляньте ще раз із субтитрами.' : 'Спробуйте ще раз: увімкніть повільну швидкість 0.75×.'}</p><button class="btn" data-act="quizAgain">Пройти тест ще раз</button></div>`;
      onDone && onDone(p);
      return;
    }
    const q = order[i];
    box.innerHTML = `<div class="quiz-head"><span class="small muted">Питання ${i + 1} з ${order.length}</span><div class="bar"><i style="width:${pct(i, order.length)}%"></i></div></div>
      <p class="q-prompt"><b>${esc(q.q)}</b></p>
      <div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.o)}</button>`).join('')}</div><div id="mqFb"></div>`;
    $$('.opt', box).forEach((b) => b.addEventListener('click', () => {
      const ok = q.options[+b.dataset.k].ok;
      if (ok) score++;
      $$('.opt', box).forEach((x) => { x.disabled = true; if (q.options[+x.dataset.k].ok) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      $('#mqFb', box).innerHTML = `<button class="btn primary block" style="margin-top:14px">${i + 1 < order.length ? 'Далі' : 'Результат'}</button>`;
      $('#mqFb button', box).addEventListener('click', () => { i++; step(); });
    }));
  }
  box._restart = () => { i = 0; score = 0; step(); };
  step();
}

/* ---------- 8. Екрани ---------- */

// Прогрес по розділах (0–100)
function sectionProgress() {
  const vids = (window.VIDEO_CONFIG || []).filter((v) => v && v.id);
  const vDone = vids.filter((v) => S.videos[v.id] && S.videos[v.id].done).length;
  const tDone = TOPICS.filter((t) => S.topics[t.id]).length;
  return {
    dict: pct(learnedCount(), WORDS.length),
    present: pct(vDone + tDone, vids.length + TOPICS.length),
    builder: S.builderDone >= 2 ? 100 : S.builderDone === 1 ? 50 : 0,
    work: pct(DIALOGS.filter((d) => S.dialogs[d.id]).length, DIALOGS.length),
    basics: pct(BASICS.filter((b) => (S.basics[b.id] || 0) >= 80).length, BASICS.length),
    vDone, vTotal: vids.length, tDone,
  };
}
function updateHeader() {
  const l = $('#wordsLearned'), t = $('#wordsTotal');
  if (l) { l.textContent = learnedCount(); t.textContent = WORDS.length; }
}

/* Флешкартки */
function viewCards(scope) {
  let pool = scope === 'all' ? WORDS : WORDS.filter((w) => w.cat === scope);
  pool = shuffle(pool.filter((w) => !isLearned(w.id))).concat(shuffle(pool.filter((w) => isLearned(w.id))));
  let i = 0, open = false, knew = 0;
  const back = scope === 'all' ? '#/dict' : `#/dict/c/${scope}`;
  function draw() {
    if (i >= pool.length) {
      app.innerHTML = `<div class="page-head">${backBtn(back)}<h1>Картки</h1></div><div class="card center stack"><div class="result-big">${knew}/${pool.length}</div><p>Ви знали ${knew} ${plural(knew, 'слово', 'слова', 'слів')}. Закріпіть тестом!</p><div class="row" style="justify-content:center"><a class="btn primary" href="#/dict/test/choose/${scope}">Тест: вибери переклад</a><button class="btn" data-act="cardsAgain">Ще раз</button></div></div>`;
      return;
    }
    const w = pool[i];
    app.innerHTML = `<div class="page-head">${backBtn(back)}<h1>Картки</h1><span class="muted small" style="margin-left:auto">${i + 1} / ${pool.length}</span></div>
      ${bar(pct(i, pool.length))}
      <div class="card flash" id="flash" style="margin-top:12px">
        ${wordPic(w, 'lg')}
        <div class="word-fr" lang="fr">${frWord(w)}</div>
        ${open ? `<div class="tr"><b>${esc(w.uk)}</b></div><div class="ex" style="max-width:460px"><div lang="fr">${esc(w.ex)}</div><div class="uk">${esc(w.exUk)}</div></div>` : '<div class="muted small">натисніть, щоб побачити переклад</div>'}
        <div class="row" style="justify-content:center">${sayBtn(w.say, 'big')}${open ? sayBtn(w.ex, 'big', 'Прослухати приклад') : ''}</div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px"><button class="btn" data-act="cardNo">🔄 Ще вчу</button><button class="btn primary" data-act="cardYes">✓ Знаю</button></div>`;
    $('#flash').addEventListener('click', (e) => { if (e.target.closest('.say')) return; if (!open) { open = true; draw(); } });
  }
  ACT.cardNo = () => { i++; open = false; draw(); TTS.stop(); speakCurrent(); };
  ACT.cardYes = () => { const w = pool[i]; const s = S.words[w.id] || (S.words[w.id] = { ok: 0, bad: 0 }); s.known = true; knew++; save(); i++; open = false; draw(); TTS.stop(); speakCurrent(); };
  ACT.cardsAgain = () => { i = 0; knew = 0; open = false; draw(); };
  const speakCurrent = () => { if (pool[i]) setTimeout(() => TTS.speak(pool[i].say), 150); };
  draw(); speakCurrent();
}

/* Тести словника: choose — вибери переклад, write — напиши, photo — фото → назва, mistakes — помилки */
function viewTest(mode, scope) {
  const back = scope === 'all' ? '#/dict' : `#/dict/c/${scope}`;
  let pool = mode === 'mistakes' ? S.mistakes.map((id) => WORD[id]).filter(Boolean) : scope === 'all' ? WORDS : WORDS.filter((w) => w.cat === scope);
  if (!pool.length) {
    app.innerHTML = `<div class="page-head">${backBtn('#/dict')}<h1>Повторення помилок</h1></div><div class="card center"><p>Помилок поки що немає 🎉</p><a class="btn primary" href="#/dict/test/choose/all">Пройти тест</a></div>`;
    return;
  }
  // Спершу — невивчені слова
  const sorted = shuffle(pool).sort((a, b) => (isLearned(a.id) ? 1 : 0) - (isLearned(b.id) ? 1 : 0));
  const qs = sorted.slice(0, Math.min(10, sorted.length)).map((w) => ({ w, kind: mode === 'mistakes' ? pick(['choose', 'write', 'photo']) : mode }));
  const titles = { choose: 'Вибери переклад', write: 'Напиши слово', photo: 'Фото → назва', mistakes: 'Повторення помилок' };
  let i = 0, score = 0; const wrong = [];

  function options(w, field) {
    const same = WORDS.filter((x) => x.id !== w.id && x.cat === w.cat && x[field] !== w[field]);
    const other = WORDS.filter((x) => x.id !== w.id && x.cat !== w.cat && x[field] !== w[field]);
    const picks = [];
    for (const x of shuffle(same).concat(shuffle(other))) { if (picks.length >= 3) break; if (!picks.some((p) => p[field] === x[field])) picks.push(x); }
    return shuffle([w, ...picks]);
  }
  function header() { return `<div class="page-head">${backBtn(back)}<h1>${titles[mode]}</h1></div><div class="quiz-head"><span class="small muted">${i + 1} / ${qs.length}</span>${bar(pct(i, qs.length))}<span class="small">✓ ${score}</span></div>`; }
  function draw() {
    if (i >= qs.length) return summary();
    const { w, kind } = qs[i];
    let body = '';
    if (kind === 'choose') {
      body = `<div class="card"><div class="q-prompt"><div class="big" lang="fr">${frWord(w)}</div><div style="margin-top:8px">${sayBtn(w.say, 'big')}</div></div>
        <div class="opts">${options(w, 'uk').map((o) => `<button class="opt" data-id="${o.id}">${esc(o.uk)}</button>`).join('')}</div><div id="fb"></div></div>`;
    } else if (kind === 'photo') {
      body = `<div class="card"><div class="q-prompt"><div style="display:flex;justify-content:center">${wordPic(w, 'lg')}</div><div class="muted small" style="margin-top:8px">Як це називається французькою?</div></div>
        <div class="opts">${options(w, 'fr').map((o) => `<button class="opt" data-id="${o.id}" lang="fr">${frWord(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
    } else {

        if (b.dataset.hint) { hint++; inp.value = w.fr.slice(0, hint + (w.fr.indexOf(' ') > 0 && w.g !== 'v' ? w.fr.indexOf(' ') + 1 : 0)); inp.focus(); return; }
        const s = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, s) + b.dataset.ch + inp.value.slice(inp.selectionEnd ?? s); inp.focus(); inp.setSelectionRange(s + 1, s + 1);

      <div class="card center stack"><div class="result-big">${score}/${qs.length}</div><p>${p === 100 ? 'Бездоганно! 🏆' : p >= 70 ? 'Добре! Ще трохи практики.' : 'Повторіть слова в картках і спробуйте знову.'}</p>
      ${wrong.length ? `<div style="text-align:left"><b>Помилки:</b>${wrong.map((w) => `<div class="phrase"><div class="grow"><div class="fr" lang="fr">${frWord(w)}</div><div class="uk">${esc(w.uk)}</div></div>${sayBtn(w.say)}</div>`).join('')}</div>` : ''}

  }
  ACT.testAgain = () => viewTest(mode, scope);
  draw();
}

// Послідовне програвання кількох фраз
function playSequence(items, onLine, onDone) {
  let k = 0, stopped = false;
  const stop = () => { stopped = true; TTS.stop(); onLine && onLine(-1); };
  const step = () => {
    if (stopped) return;
    if (k >= items.length) { onLine && onLine(-1); onDone && onDone(); return; }
    const it = typeof items[k] === 'string' ? { text: items[k] } : items[k];
    onLine && onLine(k);
    TTS.speak(it.text, { gender: it.gender, pitch: it.pitch, rate: it.rate, onend: () => { k++; setTimeout(step, 350); } });
  };
  step();
  onCleanup(stop);
  return { stop };
}

  const c = COUNTRIES[d.country] || COUNTRIES[0], since = +d.since || 0;

  if (d.city) L.push([`J'habite à ${d.city}, ${c[0]}${sinceFr ? ',' + sinceFr : ''}.`, `Я живу в місті ${d.city}, ${c[1]},${sinceUk}.`.replace(',.', '.')]);
  const j = JOBS[d.job] || JOBS[0], exp = +d.exp || 0;

  if (d.situation === 'work') L.push([`Je travaille dans une entreprise${d.city ? ' à ' + d.city : ''}.`, `Я працюю на підприємстві${d.city ? ' в місті ' + d.city : ''}.`]);

  if (d.situation === 'self') L.push(['Je travaille à mon compte.', 'Я працюю на себе.']);
  const fam = FAMILY.find((x) => x[0] === d.family) || FAMILY[0];
  let famFr = `Je suis ${f ? fam[2] : fam[1]}.`, famUk = `Я ${f ? fam[4] : fam[3]}.`;
  const hasPartner = (d.family === 'marie' || d.family === 'couple');
  if (hasPartner && d.partner) {
    if (d.family === 'marie') { famFr += f ? ` Mon mari s'appelle ${d.partner}.` : ` Ma femme s'appelle ${d.partner}.`; famUk += f ? ` Мого чоловіка звати ${d.partner}.` : ` Мою дружину звати ${d.partner}.`; }
    else { famFr += f ? ` Mon compagnon s'appelle ${d.partner}.` : ` Ma compagne s'appelle ${d.partner}.`; famUk += f ? ` Мого партнера звати ${d.partner}.` : ` Мою партнерку звати ${d.partner}.`; }
  }
  L.push([famFr, famUk]);
  const kids = (d.kids || []).slice(0, 5);
  if (!kids.length) L.push(["Je n'ai pas d'enfants.", 'У мене немає дітей.']);
  else {
    const sons = kids.filter((k) => k.s !== 'f').length, girls = kids.length - sons;
    const partsFr = [], partsUk = [];
    if (sons) { partsFr.push(sons === 1 ? 'un fils' : `${numFr(sons)} fils`); partsUk.push(sons === 1 ? 'син' : `${['', '', 'два', 'три', 'чотири', "п'ять"][sons]} ${sons < 5 ? 'сини' : 'синів'}`); }
    if (girls) { partsFr.push(girls === 1 ? 'une fille' : `${numFr(girls)} filles`); partsUk.push(girls === 1 ? 'донька' : `${['', '', 'дві', 'три', 'чотири', "п'ять"][girls]} ${girls < 5 ? 'доньки' : 'доньок'}`); }
    L.push([`J'ai ${kids.length === 1 ? 'un enfant' : numFr(kids.length) + ' enfants'} : ${partsFr.join(' et ')}.`, `У мене ${KIDS_UK[kids.length]}: ${partsUk.join(' і ')}.`]);
    for (const k of kids) {
      const girl = k.s === 'f', a = +k.age || 0, nm = (k.name || '').trim();
      let fr = `${girl ? 'Ma fille' : 'Mon fils'}${nm ? ' ' + nm : ''}${a ? ` a ${a} ${a === 1 ? 'an' : 'ans'}` : ''}.`;
      let uk = `${girl ? 'Моя донька' : 'Мій син'}${nm ? ' — ' + nm : ''}${a ? `, ${girl ? 'їй' : 'йому'} ${yearsUk(a)}` : ''}.`;
      const P = girl ? 'Elle' : 'Il', PU = girl ? 'Вона' : 'Він';

        maternelle: [`${P} va à l'école maternelle.`, `${PU} ходить до дитсадка (école maternelle).`],
        primaire: [`${P} va à l'école primaire.`, `${PU} ходить до початкової школи.`],
        college: [`${P} va au collège.`, `${PU} ходить до колежу.`],
        lycee: [`${P} va au lycée.`, `${PU} навчається в ліцеї.`],
        univ: [`${P} est ${girl ? 'étudiante' : 'étudiant'} à l'université.`, `${PU} ${girl ? 'студентка' : 'студент'} університету.`],
        travail: [`${P} travaille.`, `${PU} працює.`],

      }[k.school];
      if (sch) { fr += ' ' + sch[0]; uk += ' ' + sch[1]; }
      L.push([fr, uk]);
    }
  }
  const we = hasPartner || kids.length;
  const rooms = +d.rooms || 0, isHouse = d.home === 'maison';
  const extrasFr = [d.balcon && 'un balcon', d.jardin && 'un jardin'].filter(Boolean), extrasUk = [d.balcon && 'балконом', d.jardin && 'садом'].filter(Boolean);
  if (!isHouse && rooms === 1) L.push([`${we ? 'Nous habitons' : "J'habite"} dans un studio${extrasFr.length ? ' avec ' + listFr(extrasFr) : ''}.`, `${we ? 'Ми живемо' : 'Я живу'} у квартирі-студії${extrasUk.length ? ' з ' + listUk(extrasUk) : ''}.`]);
  else L.push([`${we ? 'Nous habitons' : "J'habite"} dans ${isHouse ? 'une maison' : 'un appartement'}${rooms ? ` de ${rooms} pièces` : ''}${extrasFr.length ? ' avec ' + listFr(extrasFr) : ''}.`,
    `${we ? 'Ми живемо' : 'Я живу'} ${isHouse ? 'в будинку' : 'у квартирі'}${rooms ? ` на ${rooms} ${plural(rooms, 'кімнату', 'кімнати', 'кімнат')}` : ''}${extrasUk.length ? ' з ' + listUk(extrasUk) : ''}.`]);
  const hb = (d.hobbies || []).map((k) => HOBBIES[k]).filter(Boolean);
  if (hb.length) L.push([`J'aime ${listFr(hb.map((h) => h[0]))}.`, `Я люблю ${listUk(hb.map((h) => h[1]))}.`]);
  const wk = (d.weekend || []).map((k) => WEEKEND[k]).filter(Boolean);
  if (wk.length) L.push([`Le week-end, ${wk.map((w) => w[0]).join(' et ')}.`, `На вихідних я ${listUk(wk.map((w) => w[1]))}.`]);
  const lg = (d.langs || []).map((k) => LANGS[k]).filter(Boolean), lv = FR_LEVEL[d.frLevel] || FR_LEVEL[0];
  L.push([`${lg.length ? `Je parle ${listFr(lg.map((x) => x[0]))}. ` : ''}Je parle ${lv[0]} français.`, `${lg.length ? `Я розмовляю ${listUk(lg.map((x) => x[1]))}. ` : ''}Французькою я розмовляю ${lv[1]}.`]);
  L.push(["J'apprends le français tous les jours. Merci !", 'Я вчу французьку щодня. Дякую!']);
  return L;
}

// Режими вивчення: text — весь текст, gaps — пропуски, letters — перші літери, hide — лише переклад
function maskLine(fr, mode, li) {
  if (mode === 'text') return esc(fr);
  if (mode === 'hide') return '<span class="blank show" style="color:transparent;background:var(--line)">' + esc(fr) + '</span>';
  let wi = 0;
  return fr.split(/(\s+)/).map((tok) => {
    if (/^\s+$/.test(tok) || !tok) return tok;
    const m = tok.match(/^([«"(]*)(.*?)([.,!?:;»")]*)$/);
    const core = m[2];
    if (core.length < 3 || /^\d/.test(core)) return esc(tok);
    wi++;
    if (mode === 'gaps' && (wi + li) % 2) return esc(tok);
    if (mode === 'letters') return esc(m[1]) + `<span class="blank" data-w="${esc(core)}" title="Натисніть, щоб побачити">${esc(core[0] + '·'.repeat(core.length - 1))}</span>` + esc(m[3]);
    return esc(m[1]) + `<span class="blank" data-w="${esc(core)}" title="Натисніть, щоб побачити">${esc(core)}</span>` + esc(m[3]);
  }).join('');
}

  function bubble(l, k, opts = {}) {
    const me = !!l[2];
    return `<div class="bubble ${me ? 'me' : 'them'} ${opts.cls || ''}" data-k="${k}"><div class="grow"><div class="who">${me ? 'Ви' : esc(d.who)}</div><div class="fr" lang="fr">${esc(l[0])}</div><div class="uk">${esc(l[1])}</div>${opts.extra || ''}</div>${opts.noSay ? '' : `<button class="say" type="button" data-act="sayLine" data-k="${k}" aria-label="Прослухати"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>`}</div>`;
  }
  function draw() {
    app.innerHTML = `<div class="page-head">${backBtn('#/work')}<h1>${d.icon} ${d.title}</h1></div>
      <div class="row between" style="margin-bottom:12px"><div class="seg-ctl" id="dMode"><button data-m="read" class="${mode === 'read' ? 'on' : ''}">Читати і слухати</button><button data-m="role" class="${mode === 'role' ? 'on' : ''}">Рольова гра</button></div>
      ${mode === 'read' ? `<button class="btn small primary" data-act="dPlay">${seq ? '■ Стоп' : '▶ Прослухати діалог'}</button>` : `<button class="btn small" data-act="dRestart">↺ Почати знову</button>`}</div>
      <div class="card"><div class="dlg" id="dlg">${mode === 'read' ? d.lines.map((l, k) => bubble(l, k)).join('') : roleHTML()}</div></div>
      <div class="card"><h3>🔑 Ключові слова</h3>${d.keys.map(([fr, uk]) => `<div class="phrase"><div class="grow"><div class="fr" lang="fr">${esc(fr)}</div><div class="uk">${esc(uk)}</div></div>${sayBtn(fr)}</div>`).join('')}</div>
      <button class="btn ${S.dialogs[d.id] ? 'on' : ''}" data-act="dDone" style="margin-top:12px">${S.dialogs[d.id] ? '✓ Діалог пройдено' : 'Позначити як пройдений'}</button>`;
    $('#dMode').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (!b) return; if (seq) { seq.stop(); seq = null; } TTS.stop(); mode = b.dataset.m; rp = 0; revealed = false; draw(); if (mode === 'role') roleStep(); });
  }
  function roleHTML() {
    let h = d.lines.slice(0, rp).map((l, k) => bubble(l, k)).join('');
    if (rp >= d.lines.length) return h + `<div class="note center">🎉 Діалог завершено! Повторіть ще раз, щоб говорити впевнено.</div>`;
    const l = d.lines[rp];
    if (l[2]) {
      h += bubble(l, rp, { cls: revealed ? 'now' : 'your-turn hide-fr', noSay: !revealed, extra: revealed ? `<button class="btn small primary" data-act="rpNext" style="margin-top:8px">Далі →</button>` : `<div class="small" style="margin-top:6px"><b>Ваша черга!</b> Скажіть це французькою вголос.</div><button class="btn small primary" data-act="rpShow" style="margin-top:8px">Показати і прослухати</button>` });
    } else h += bubble(l, rp, { cls: 'now' });
    return h;
  }
  function roleStep() {
    const box = $('#dlg'); if (!box) return;
    box.innerHTML = roleHTML();
    const cur = box.lastElementChild; if (cur && cur.scrollIntoView) cur.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    if (rp >= d.lines.length) { S.dialogs[d.id] = true; save(); return; }
    const l = d.lines[rp];
    if (!l[2]) TTS.speak(l[0], Object.assign({ onend: () => { if (mode === 'role' && d.lines[rp] === l) { rp++; revealed = false; roleStep(); } } }, voiceOf(false)));
  }
  ACT.rpShow = () => { revealed = true; const l = d.lines[rp]; $('#dlg').innerHTML = roleHTML(); TTS.speak(l[0], voiceOf(true)); };
  ACT.rpNext = () => { TTS.stop(); rp++; revealed = false; roleStep(); };
  ACT.dRestart = () => { TTS.stop(); rp = 0; revealed = false; draw(); roleStep(); };
  ACT.sayLine = (b) => { const l = d.lines[+b.dataset.k]; TTS.speak(l[0], voiceOf(!!l[2])); };
  ACT.dPlay = (b) => {
    if (seq) { seq.stop(); seq = null; b.textContent = '▶ Прослухати діалог'; return; }
    b.textContent = '■ Стоп';
    seq = playSequence(d.lines.map((l) => Object.assign({ text: l[0] }, voiceOf(!!l[2]))), (k) => $$('#dlg .bubble').forEach((el) => el.classList.toggle('now', +el.dataset.k === k)),
      () => { seq = null; const bb = $('[data-act="dPlay"]'); if (bb) bb.textContent = '▶ Прослухати діалог'; S.dialogs[d.id] = true; save(); });
  };
  ACT.dDone = () => { S.dialogs[d.id] = !S.dialogs[d.id]; if (!S.dialogs[d.id]) delete S.dialogs[d.id]; save(); draw(); };
  draw();
}

/* ===== База ===== */
function viewBasics() {
  app.innerHTML = `<div class="page-head"><h1>База</h1></div>
    <p class="muted">Те, що на роботі потрібно щодня: числа, розміри, кольори, дні та час. У кожній темі — тест; тема зараховується від 80%.</p>
    <div class="sec-list">${BASICS.map((b) => `<a class="sec-item" href="#/basics/${b.id}"><span style="font-size:1.5rem">${b.icon}</span><div class="grow"><div class="t">${b.title}</div><div class="s">${b.sub}</div></div>${S.basics[b.id] != null ? ring(S.basics[b.id]) : '<span class="num">›</span>'}</a>`).join('')}</div>`;
}
function clockSVG(h, m) {
  const am = m * 6, ah = (h % 12) * 30 + m * 0.5;
  return `<svg class="clock" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#3a3a3a" stroke-width="3"/>${lines(12, (i) => `<path d="M50 8 V${i % 3 ? 13 : 17}" stroke="#3a3a3a" stroke-width="${i % 3 ? 1.5 : 3}" transform="rotate(${i * 30} 50 50)"/>`)}<path d="M50 50 V27" stroke="#2f3338" stroke-width="5" stroke-linecap="round" transform="rotate(${ah} 50 50)"/><path d="M50 50 V14" stroke="#b8622a" stroke-width="3" stroke-linecap="round" transform="rotate(${am} 50 50)"/><circle cx="50" cy="50" r="3.5" fill="#2f3338"/></svg>`;
}
// Тест з варіантами. q: { html, say, opts: [{ html, ok }], after, grid }
function runChoiceQuiz(box, qs, onDone) {
  let i = 0, score = 0;
  function step() {
    if (i >= qs.length) {
      const p = pct(score, qs.length);
      box.innerHTML = `<div class="center stack"><div class="result-big">${score}/${qs.length}</div><p>${p >= 80 ? 'Тему зараховано ✓' : 'Потрібно 80%, щоб зарахувати тему. Ще раз?'}</p><button class="btn primary" data-act="basicsAgain">Ще раз</button></div>`;
      onDone(p); return;
    }
    const q = qs[i];
    box.innerHTML = `<div class="quiz-head"><span class="small muted">${i + 1} / ${qs.length}</span>${bar(pct(i, qs.length))}<span class="small">✓ ${score}</span></div>
      <div class="q-prompt">${q.html || ''}${q.say ? `<div style="margin-top:8px">${sayBtn(q.say, 'big', 'Слухати ще раз')}</div>` : ''}</div>
      <div class="opts ${q.grid || ''}">${q.opts.map((o, k) => `<button class="${q.grid ? 'clock-opt' : 'opt'}" data-k="${k}">${o.html}</button>`).join('')}</div><div id="bqFb"></div>`;
    if (q.say) setTimeout(() => TTS.speak(q.say), 200);
    $$('[data-k]', box).forEach((b) => b.addEventListener('click', () => {
      if ($('#bqFb', box).innerHTML) return;
      const ok = q.opts[+b.dataset.k].ok; if (ok) score++;
      $$('[data-k]', box).forEach((x) => { x.disabled = true; if (q.opts[+x.dataset.k].ok) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      if (q.afterSay) TTS.speak(q.afterSay);
      $('#bqFb', box).innerHTML = `${q.after ? `<div class="feedback ${ok ? 'ok' : 'bad'}">${q.after}</div>` : ''}<button class="btn primary block" style="margin-top:12px">${i + 1 < qs.length ? 'Далі →' : 'Результат'}</button>`;
      $('#bqFb button', box).addEventListener('click', () => { i++; step(); });
    }));
  }
  step();
}
function optionSet(correct, pool, n = 4) {
  const out = [correct];
  for (const x of shuffle(pool)) { if (out.length >= n) break; if (!out.includes(x)) out.push(x); }
  return shuffle(out);
}
const CONFUSE = { 60: [70, 16], 70: [60, 17, 71], 80: [20, 18, 81], 90: [19, 80, 99], 16: [60, 6], 17: [70, 7], 14: [40, 4], 40: [14, 44], 15: [50, 5], 50: [15, 55], 13: [30, 3], 30: [13, 33], 12: [20, 2], 20: [12, 80], 96: [76, 86, 66], 98: [78, 88, 18], 75: [65, 95, 15], 66: [76, 86], 45: [55, 35, 54], 35: [25, 45, 53], 25: [35, 52], 95: [75, 85, 59], 18: [80, 8, 98], 22: [62, 82, 2], 10: [100, 2], 5: [15, 50] };
function nearNums(n) {
  const s = new Set((CONFUSE[n] || []).concat([n + 10, n - 10, +String(n).split('').reverse().join(''), n + 1, n - 1, n + 20]));
  s.delete(n); return [...s].filter((x) => x > 0);
}
function genDim() {
  const t = pick(['mm', 'cm', 'm', 'm']);
  if (t === 'mm') { const n = pick([4, 5, 6, 8, 10, 12, 15, 16, 18, 22, 25, 30, 35, 40, 45, 60, 70, 80, 90]); return { say: `${numFr(n)} millimètres`, ok: `${n} мм`, alt: nearNums(n).map((x) => `${x} мм`) }; }
  if (t === 'cm') { const n = pick([12, 14, 16, 17, 20, 25, 30, 35, 40, 45, 60, 66, 70, 75, 80, 90, 96, 98]); return { say: `${numFr(n)} centimètres`, ok: `${n} см`, alt: nearNums(n).map((x) => `${x} см`) }; }
  const m = pick([1, 2, 2, 3]), c = pick([5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 95]);
  const disp = (mm, cc) => `${mm},${String(cc).padStart(2, '0')} м`;
  return { say: `${m === 1 ? 'un mètre' : numFr(m) + ' mètres'} ${numFr(c)}`, ok: disp(m, c), alt: nearNums(c).filter((x) => x < 100).map((x) => disp(m, x)).concat([disp(m === 1 ? 2 : m - 1, c), disp(m + 1, c)]) };
}

function viewBasic(id) {
  const b = BASICS.find((x) => x.id === id); if (!b) return viewBasics();
  const head = `<div class="page-head">${backBtn('#/basics')}<h1>${b.icon} ${b.title}</h1>${S.basics[id] != null ? `<span class="badge ${S.basics[id] >= 80 ? 'ok' : ''}" style="margin-left:auto">найкраще: ${S.basics[id]}%</span>` : ''}</div>`;
  const phraseList = (arr) => arr.map(([fr, uk]) => `<div class="phrase"><div class="grow"><div class="fr" lang="fr">${esc(fr)}</div><div class="uk">${esc(uk)}</div></div>${sayBtn(fr.replace(/\(.*?\)/g, ''))}</div>`).join('');
  const done = (p) => { S.basics[id] = Math.max(S.basics[id] || 0, p); save(); };
  let body = '', quiz = null;

  if (id === 'nombres') {
    const nums = [...Array(21).keys(), 21, 22, 30, 31, 40, 50, 60, 69, 70, 71, 72, 77, 80, 81, 88, 90, 91, 99, 100, 101, 200, 250, 500, 1000, 1500, 2000];
    body = `<div class="card"><p class="small muted">Натисніть на число, щоб почути. Увага на 70, 80, 90: <b lang="fr">soixante-dix</b> = 60+10, <b lang="fr">quatre-vingts</b> = 4×20, <b lang="fr">quatre-vingt-dix</b> = 4×20+10.</p>
      <div class="num-grid">${nums.map((n) => `<button class="num-cell" data-say="${n}"><b>${n}</b><span lang="fr">${numFr(n)}</span></button>`).join('')}</div></div>
      <div class="card"><h3>🎧 Тест: почуй число — напиши цифрами</h3><div id="bq"></div></div>`;
    quiz = () => {
      const box = $('#bq'), qs = [];
      const ranges = [[0, 20], [21, 69], [70, 79], [80, 99], [70, 99], [21, 99], [100, 999], [1000, 2500], [70, 99], [11, 19]];
      for (const [a, z] of ranges) qs.push(a + Math.floor(Math.random() * (z - a + 1)));
      let i = 0, score = 0;
      const step = () => {
        if (i >= qs.length) { const p = pct(score, qs.length); box.innerHTML = `<div class="center stack"><div class="result-big">${score}/${qs.length}</div><p>${p >= 80 ? 'Тему зараховано ✓' : 'Потрібно 80%. Ще раз?'}</p><button class="btn primary" data-act="basicsAgain">Ще раз</button></div>`; done(p); return; }
        const n = qs[i];
        box.innerHTML = `<div class="quiz-head"><span class="small muted">${i + 1} / ${qs.length}</span>${bar(pct(i, qs.length))}<span class="small">✓ ${score}</span></div>
          <div class="q-prompt">${sayBtn(String(n), 'big', 'Слухати ще раз')}</div>
          <form id="nf"><input class="input" id="ni" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="число цифрами"><button class="btn primary block" style="margin-top:10px">Перевірити</button></form><div id="nfb"></div>`;
        setTimeout(() => TTS.speak(String(n)), 200);
        const inp = $('#ni'); inp.focus();
        $('#nf').addEventListener('submit', (e) => {
          e.preventDefault(); if ($('#nfb').innerHTML || !inp.value.trim()) return;
          const ok = +inp.value.replace(/\s/g, '') === n; if (ok) score++;
          inp.disabled = true;
          $('#nfb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}">${ok ? '✓ Правильно!' : `✗ Це було <b>${n}</b>`} — <span lang="fr">${numFr(n)}</span></div><button class="btn primary block" style="margin-top:12px">${i + 1 < qs.length ? 'Далі →' : 'Результат'}</button>`;
          const nb = $('#nfb button'); nb.focus(); nb.addEventListener('click', () => { i++; step(); });
        });
      };
      step();
    };
  }
  if (id === 'mesures') {
    body = `<div class="card"><h3>📏 Слова</h3>${phraseList(DIM_WORDS)}</div><div class="card"><h3>💬 Фрази на роботі</h3>${phraseList(DIM_PHRASES)}</div>
      <div class="card"><h3>🎧 Тест: почуй розмір — вибери</h3><div id="bq"></div></div>`;
    quiz = () => runChoiceQuiz($('#bq'), Array.from({ length: 8 }, () => {
      const g = genDim(); const opts = optionSet(g.ok, g.alt);
      return { say: g.say, html: '<div class="muted small">Який розмір ви почули?</div>', opts: opts.map((o) => ({ html: esc(o), ok: o === g.ok })), after: `<span lang="fr">${esc(g.say)}</span> = <b>${esc(g.ok)}</b>` };
    }), done);
  }
  if (id === 'couleurs') {
    body = `<div class="card"><p class="small muted">Колір узгоджується з родом: <span lang="fr">un mur blanc</span>, але <span lang="fr">une porte blanche</span>.</p>
      ${COLORS.map(([m, f, uk, hex]) => `<div class="phrase" style="align-items:center"><span class="swatch" style="background:${hex}"></span><div class="grow"><div class="fr" lang="fr">${m}${f !== m ? ' / ' + f : ''}</div><div class="uk">${uk}</div></div>${sayBtn(f !== m ? `${m}, ${f}` : m)}</div>`).join('')}</div>
      <div class="card"><h3>🪵 Оздоблення</h3>${COLOR_EXTRA.map(([fr, uk, ex, exUk]) => `<div class="phrase"><div class="grow"><div class="fr" lang="fr">${esc(fr)} — <span class="uk">${esc(uk)}</span></div><div class="small" lang="fr">${esc(ex)}</div><div class="uk">${esc(exUk)}</div></div>${sayBtn(ex)}</div>`).join('')}</div>
      <div class="card"><h3>🎨 Тест: подивись на колір — вибери назву</h3><div id="bq"></div></div>`;
    quiz = () => runChoiceQuiz($('#bq'), shuffle(COLORS).slice(0, 8).map((c) => {
      const opts = optionSet(c[0], COLORS.map((x) => x[0]));
      return { html: `<div style="display:flex;justify-content:center"><span class="swatch" style="width:110px;height:110px;border-radius:20px;background:${c[3]}"></span></div>`, opts: opts.map((o) => ({ html: `<span lang="fr">${esc(o)}</span>`, ok: o === c[0] })), after: `<b lang="fr">${esc(c[0])}</b> — ${esc(c[2])}`, afterSay: c[0] };
    }), done);
  }
  if (id === 'jours') {
    body = `<div class="card"><h3>📅 Дні тижня</h3>${phraseList(DAYS)}</div><div class="card"><h3>🗓️ Місяці</h3>${phraseList(MONTHS)}</div><div class="card"><h3>⏳ Коли?</h3>${phraseList(TIME_WORDS)}
      <div class="ex" style="margin-top:8px"><div lang="fr">Lundi, je commence un nouveau chantier.</div><div class="uk">У понеділок я починаю новий об’єкт.</div></div></div>
      <div class="card"><h3>🎧 Тест: почуй — вибери переклад</h3><div id="bq"></div></div>`;
    quiz = () => runChoiceQuiz($('#bq'), shuffle(DAYS.concat(MONTHS)).slice(0, 8).map(([fr, uk]) => {
      const set = DAYS.some((d) => d[0] === fr) ? DAYS : MONTHS;
      const opts = optionSet(uk, set.map((x) => x[1]));
      return { say: fr, html: '<div class="muted small">Що ви почули?</div>', opts: opts.map((o) => ({ html: esc(o), ok: o === uk })), after: `<b lang="fr">${esc(fr)}</b> — ${esc(uk)}` };
    }), done);
  }
  if (id === 'heure') {
    const ex = [[7, 0], [7, 15], [7, 30], [7, 45], [12, 0], [16, 30]];
    body = `<div class="card"><h3>🕒 Котра година?</h3><div class="grid tiles">${ex.map(([h, m]) => `<button class="clock-opt" data-say="Il est ${timeFr(h, m)}.">${clockSVG(h, m)}<b>${timeDigits(h, m)}</b><span class="small" lang="fr">${timeFr(h, m)}</span></button>`).join('')}</div>
      <p class="small muted" style="margin-top:10px">На роботі й у розкладах часто кажуть «офіційно», 24 години: <span lang="fr">16 h 30 — seize heures trente</span>.</p></div>
      <div class="card"><h3>💬 Фрази</h3>${phraseList(TIME_PHRASES)}</div>
      <div class="card"><h3>🎧 Тест: почуй час — вибери годинник</h3><div id="bq"></div></div>`;
    quiz = () => runChoiceQuiz($('#bq'), Array.from({ length: 8 }, () => {
      const h = 6 + Math.floor(Math.random() * 12), m = pick([0, 15, 30, 45, 10, 20, 40, 50, 5]);
      const official = h > 12 && Math.random() < 0.5;
      const key = (hh, mm) => `${(hh + 24) % 24}:${mm}`;
      const cands = [[h, m], [h + 1, m], [h - 1, m], [h, (m + 30) % 60], [h, (60 - m) % 60 || 45], [h + 1, (m + 15) % 60]];
      const uniq = []; for (const c of cands) if (!uniq.some((u) => key(...u) === key(...c)) && c[0] >= 0) uniq.push(c);
      const opts = [uniq[0]].concat(shuffle(uniq.slice(1)).slice(0, 3));
      const say = 'Il est ' + timeFr(h, m, official) + '.';
      return { say, grid: 'clocks', html: '<div class="muted small">Яку годину ви почули?</div>', opts: shuffle(opts).map(([hh, mm]) => ({ html: `${clockSVG(hh, mm)}<b>${timeDigits((hh + 24) % 24, mm)}</b>`, ok: key(hh, mm) === key(h, m) })), after: `<span lang="fr">${esc(say)}</span> = <b>${timeDigits(h, m)}</b>` };
    }), done);
  }
  app.innerHTML = head + body;
  ACT.basicsAgain = () => quiz && quiz();
  if (quiz) quiz();
}

/* ---------- 9. Навігація і запуск ---------- */
function route() {
  runCleanup();
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').filter(Boolean).map(decodeURIComponent);
  const [a, b, c, d] = parts;
  const tab = { dict: 'dict', present: 'present', builder: 'builder', work: 'work', basics: 'basics' }[a] || 'home';
  $$('.tabbar a').forEach((x) => x.classList.toggle('on', x.dataset.tab === tab));
  if (!a) viewHome();
  else if (a === 'settings') viewSettings();
  else if (a === 'credits') viewCredits();
  else if (a === 'dict' && b === 'c') viewCat(c);
  else if (a === 'dict' && b === 'cards') viewCards(c || 'all');
  else if (a === 'dict' && b === 'test') viewTest(c || 'choose', d || 'all');
  else if (a === 'dict') viewDict();
  else if (a === 'present' && b === 'v') viewVideo(c);
  else if (a === 'present' && b === 't') viewTopic(c);
  else if (a === 'present') viewPresent();
  else if (a === 'builder') viewBuilder();
  else if (a === 'work' && b) viewDialog(b);
  else if (a === 'work') viewWork();
  else if (a === 'basics' && b) viewBasic(b);
  else if (a === 'basics') viewBasics();
  else viewHome();
  window.scrollTo(0, 0);
}

document.addEventListener('click', (e) => {
  const pl = e.target.closest('[data-pl]');
  if (pl) { playerAction(pl); return; }
  const say = e.target.closest('[data-say]');
  if (say) { sayFrom(say); return; }
  const act = e.target.closest('[data-act]');
  if (act && ACT[act.dataset.act]) { e.preventDefault(); ACT[act.dataset.act](act, e); }
});
// Пробіл — пауза/відтворення у відео
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && player && player.toggle && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); player.toggle(); }
});
window.addEventListener('hashchange', route);
applyTheme();
TTS.init();
updateHeader();
route();
